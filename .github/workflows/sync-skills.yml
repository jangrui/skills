name: Sync skills

# 统一的 skill 同步 workflow（matrix 驱动，替代 12 个独立 workflow）
# 每个矩阵项对应一个市场场景组：
#   - marketplace_group: marketplace 条目名，用于版本、分支和并发锁
#   - components:         同组的上游同步脚本；定时任务中串行执行
#   - pr_hint:            PR 正文中给 review 者的路径提示
#
# 机制：跑 scripts/sync-<plugin>-skills.sh → 已收录内容变化时递增组版本 → 自动开 PR → 自动审核 → 自动合并
# 自动审核门禁（本 workflow）：diff 仅限 skills/ 和 marketplace 版本、无 SKILL.md 被删、JSON 合法
# AI 审核：由 CodeRabbit GitHub App 独立评审（非阻塞，仅建议）
# 修 bug 只改这一个文件即可，不再维护 12 份副本
"on":
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      plugin:
        description: '运行指定同步源所属的市场组（留空跑全部）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - anthropic
          - anydoc
          - baoyu
          - dbx
          - diagram
          - golang
          - grafana
          - gzh
          - illustration
          - khazix
          - lark
          - libtv
          - mattpocock
          - opc
          - ppt
          - shuohao
          - shotcraft
          - taste
          - wpsnote
          - writing

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          ALL='[
            {"marketplace_group":"jangrui-coding","components":["golang","mattpocock","dbx"],"pr_hint":"skills/golang/、skills/mattpocock/、skills/dbx/"},
            {"marketplace_group":"jangrui-collab","components":["lark","wpsnote"],"pr_hint":"skills/lark/、skills/wpsnote/"},
            {"marketplace_group":"jangrui-daily","components":["writing","khazix"],"pr_hint":"skills/<repo>/<skill>/（日常辅助）"},
            {"marketplace_group":"jangrui-design","components":["taste"],"pr_hint":"skills/taste/<skill>/"},
            {"marketplace_group":"jangrui-diagram","components":["diagram"],"pr_hint":"skills/<repo>/<skill>/（绘图仓）"},
            {"marketplace_group":"jangrui-observability","components":["grafana"],"pr_hint":"skills/grafana/<category>/<skill>/"},
            {"marketplace_group":"jangrui-office","components":["anthropic","anydoc","ppt"],"pr_hint":"skills/anthropic/、skills/anydoc/、skills/ppt/"},
            {"marketplace_group":"jangrui-opc","components":["opc"],"pr_hint":"skills/opc/<skill>/"},
            {"marketplace_group":"jangrui-video","components":["shotcraft","libtv","shuohao"],"pr_hint":"skills/shotcraft/、skills/libtv/、skills/shuohao/"},
            {"marketplace_group":"jangrui-writing","components":["baoyu","gzh","illustration"],"pr_hint":"skills/baoyu/、skills/gzh/、skills/illustration/"}
          ]'
          SELECTED="${{ github.event.inputs.plugin }}"
          if [ -n "$SELECTED" ]; then
            MATRIX=$(echo "$ALL" | jq -c --arg p "$SELECTED" 'map(select(.components | index($p)))')
          else
            MATRIX=$(echo "$ALL" | jq -c '.')
          fi
          echo "matrix<<MATRIX_EOF" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" >> "$GITHUB_OUTPUT"
          echo "MATRIX_EOF" >> "$GITHUB_OUTPUT"

  sync:
    needs: matrix-config
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.matrix-config.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: sync-${{ matrix.marketplace_group }}-skills
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh main
        run: |
          git fetch origin main --depth=1
          git checkout --detach origin/main

      - name: Run group sync scripts
        id: sync
        run: |
          set -euo pipefail
          ALL_CHANGES_FILE=/tmp/updated-skills.txt
          DEFERRED_GROUPS_FILE=/tmp/marketplace-version-groups.txt
          : > "$ALL_CHANGES_FILE"
          : > "$DEFERRED_GROUPS_FILE"
          COMPONENTS='${{ toJson(matrix.components) }}'

          while IFS= read -r PLUGIN; do
            PLUGIN_CHANGES_FILE="/tmp/updated-${PLUGIN}-skills.txt"
            : > "$PLUGIN_CHANGES_FILE"
            CI_CHANGES_FILE="$PLUGIN_CHANGES_FILE" \
              MARKETPLACE_VERSION_DEFER=1 \
              MARKETPLACE_VERSION_GROUPS_FILE="$DEFERRED_GROUPS_FILE" \
              bash "./scripts/sync-${PLUGIN}-skills.sh"
            if [ -s "$PLUGIN_CHANGES_FILE" ]; then
              sed "s#^#${PLUGIN}/#" "$PLUGIN_CHANGES_FILE" >> "$ALL_CHANGES_FILE"
            fi
          done < <(printf '%s' "$COMPONENTS" | jq -r '.[]')

          if [ -s "$DEFERRED_GROUPS_FILE" ]; then
            python3 ./scripts/bump-marketplace-versions.py bump-groups \
              --marketplace ./.claude-plugin/marketplace.json \
              --groups-file "$DEFERRED_GROUPS_FILE"
          fi

          if [ -s "$ALL_CHANGES_FILE" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "updated<<EOF" >> "$GITHUB_OUTPUT"
            cat "$ALL_CHANGES_FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            count=$(wc -l < "$ALL_CHANGES_FILE" | tr -d ' ')
            echo "count=$count" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version automation
        run: |
          bash -n scripts/lib/marketplace-version.sh scripts/sync-*-skills.sh
          python3 -m unittest -v tests/test_marketplace_versions.py
          jq empty .claude-plugin/marketplace.json

      - name: Skip if no changes
        if: steps.sync.outputs.has_changes != 'true'
        run: echo "✅ 所有 ${{ matrix.marketplace_group }} 组内 skill 已是最新，无需 PR"

      - name: Create branch & commit
        id: commit
        if: steps.sync.outputs.has_changes == 'true'
        env:
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}
          GROUP: ${{ matrix.marketplace_group }}
        run: |
          BRANCH="chore/sync-${GROUP}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -B "$BRANCH"
          git add -- skills/ .claude-plugin/marketplace.json
          # 防御 sync 脚本误报：仅在确有可提交变化时才 commit/PR，避免空提交致 PR 失败
          if git diff --cached --quiet; then
            echo "pr_ready=false" >> "$GITHUB_OUTPUT"
            echo "[SKIP] ${GROUP}: 脚本报告有更新但 git 无实际差异，跳过 PR"
            exit 0
          fi
          git commit -m "$(cat <<COMMIT_EOF
          chore(${GROUP}): sync ${COUNT} upstream skill(s)

          Updated: $(echo "$UPDATED" | tr '\n' ' ')

          Run the matching ./scripts/sync-*-skills.sh --check commands locally to reproduce.
          COMMIT_EOF
          )"
          git push origin "$BRANCH" --force
          echo "pr_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.commit.outputs.pr_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}
          PR_HINT: ${{ matrix.pr_hint }}
          GROUP: ${{ matrix.marketplace_group }}
        run: |
          PR_BODY=$(cat <<BODY
          ## 上游同步

          本次检测到 **${COUNT} 个** ${GROUP} 组内 skill 有上游更新，已自动 vendor 到 \`${PR_HINT}\`；若已收录内容发生变化，市场组版本会一并递增。

          ### 更新的 skill
          $(echo "$UPDATED" | sed 's/^/- /')

          ### 校验
          - ✅ 同步脚本执行完成
          - ✅ 自包含性自检通过

          ### 自动审核 & 合并
          - 门禁：diff 仅限 \`skills/\` 与该组的 \`marketplace.json\` 版本字段、无 \`SKILL.md\` 删除、JSON 合法
          - 通过即自动 squash 合并；不通过会评论原因并留人工
          - AI 评审（CodeRabbit）为非阻塞建议

          ---
          _此 PR 由 GitHub Action [\`sync-skills\`](../actions/workflows/sync-skills.yml) 自动生成。_
          BODY
          )

          # 幂等：每场景组固定分支，已有 open PR 则仅 force-push 更新内容（PR 自动跟随），跳过重复创建
          EXISTING=$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "已存在 open PR #${EXISTING}，已通过 force-push 更新内容，跳过重复创建"
            exit 0
          fi

          gh pr create \
            --title "chore(${GROUP}): sync ${COUNT} upstream skill(s) 🔄" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"

      - name: Auto-review & merge
        # 总是运行：既合并本次新建 PR，也清理本场景组遗留 open sync PR（无 PR 则跳过）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROUP: ${{ matrix.marketplace_group }}
        run: |
          set -euo pipefail
          BRANCH="chore/sync-${GROUP}"
          # 定位本场景组的 open PR（固定分支，新建/复用两种情形统一处理）
          PR=$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "${PR}" ]; then
            echo "未找到 ${BRANCH} 的 open PR，跳过自动合并"
            exit 0
          fi
          echo "🎯 自动审核 PR #${PR} (${GROUP})"

          # 即使本轮没有新变更，也要审核并处理已有 PR：检出实际 PR 分支，
          # 再用 merge-base 取得精确差异，避免误审当前 main。
          # 校验器从当前 main 复制，不能执行待审 PR 自己改写后的脚本。
          TRUSTED_VERSION_VALIDATOR=/tmp/bump-marketplace-versions.py
          cp ./scripts/bump-marketplace-versions.py "$TRUSTED_VERSION_VALIDATOR"
          MAIN_REFSPEC="+refs/heads/main:refs/remotes/origin/main"
          BRANCH_REFSPEC="+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin "$MAIN_REFSPEC" "$BRANCH_REFSPEC"
          else
            git fetch --no-tags origin "$MAIN_REFSPEC" "$BRANCH_REFSPEC"
          fi
          git checkout --detach "origin/${BRANCH}"
          BASE=$(git merge-base origin/main HEAD)
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "变更文件："; echo "${CHANGED}" | sed 's/^/  /'

          # 门禁 1：只允许同步内容和唯一的市场版本文件。
          OUT_OF_SCOPE=$(echo "${CHANGED}" | grep -v -E '^(skills/|\.claude-plugin/marketplace\.json$)' || true)
          if [ -n "${OUT_OF_SCOPE}" ]; then
            MSG=$(printf '⛔ **自动审核未通过**：检测到 `skills/` 之外的变更，已阻止自动合并，需人工介入：\n\n```\n%s\n```' "${OUT_OF_SCOPE}")
            gh pr comment "${PR}" --body "${MSG}"
            exit 1
          fi

          # 门禁 2：不允许删除 SKILL.md（上游删除需人工确认，防止 skill 静默丢失）
          DELETED_SKILL=$(git diff --name-only --diff-filter=D "$BASE" HEAD | grep 'SKILL.md$' || true)
          if [ -n "${DELETED_SKILL}" ]; then
            MSG=$(printf '⛔ **自动审核未通过**：检测到 SKILL.md 被删除，需人工确认：\n\n```\n%s\n```' "${DELETED_SKILL}")
            gh pr comment "${PR}" --body "${MSG}"
            exit 1
          fi

          # 门禁 3：受影响的 JSON 必须可解析（plugin.json / marketplace.json 等）
          JSON_FILES=$(echo "${CHANGED}" | grep -E '\.json$' || true)
          if [ -n "${JSON_FILES}" ]; then
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              if ! jq empty "$f" 2>/dev/null; then
                MSG=$(printf '⛔ **自动审核未通过**：JSON 文件 `%s` 解析失败。' "$f")
                gh pr comment "${PR}" --body "${MSG}"
                exit 1
              fi
            done <<< "${JSON_FILES}"
          fi

          # 门禁 4：市场清单只能递增本场景组的 version，不能借同步 PR 改策展内容。
          if echo "${CHANGED}" | grep -qx '.claude-plugin/marketplace.json'; then
            python3 "$TRUSTED_VERSION_VALIDATOR" validate-diff \
              --marketplace ./.claude-plugin/marketplace.json \
              --base "$BASE" \
              --target HEAD \
              --allowed-group "${GROUP}"
          fi

          echo "✅ 四道门禁通过，准备 squash 合并"
          # matrix 各组并行运行：任一组先合并会使 main 前移，GitHub 以
          # "Base branch was modified" 暂态拒绝其余组合并。重试并将最新 main
          # 合入 PR 分支（触发 mergeability 重算）即可自愈；各组只改各自
          # vendor 目录与 marketplace.json 中本组的 version 字段，不会冲突。
          merge_ok=0
          for attempt in 1 2 3 4 5; do
            if gh pr merge "${PR}" --squash --delete-branch; then
              merge_ok=1
              break
            fi
            echo "⚠️ 第 ${attempt}/5 次合并失败（常见于 main 暂时前移），拉平分支后重试"
            gh pr update-branch "${PR}" 2>/dev/null || true
            sleep $(( attempt * 20 ))
          done
          if [ "${merge_ok}" = "1" ]; then
            echo "🎉 PR #${PR} 已自动合并到 main"
          elif gh pr merge "${PR}" --squash --auto --delete-branch 2>/dev/null; then
            # 降级：尝试 GitHub 原生 auto-merge（需 repo settings 开启该功能）
            gh pr comment "${PR}" --body "ℹ️ 自动合并被分支保护阻挡，已开启 auto-merge，待条件满足后自动合并。"
          else
            gh pr comment "${PR}" --body "⚠️ 自动合并失败（已重试 5 次）。请检查 main 分支保护（是否要求 required reviews）或 CodeRabbit 等 required check 未通过。"
            exit 1
          fi
