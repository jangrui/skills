name: Sync skills

# 统一的 skill 同步 workflow（matrix 驱动，替代 12 个独立 workflow）
# 每个矩阵项对应一个插件源：
#   - plugin:    插件标识（baoyu / golang / lark …），用于分支名、label、脚本名
#   - add_path:  git add 的路径（部分插件路径与名称不同，如 wpsnote → writing/wpsnote）
#   - pr_hint:   PR 正文中给 review 者的路径提示
#
# 机制：跑 scripts/sync-<plugin>-skills.sh → 若有更新则自动开 PR → 自动审核 → 自动合并
# 自动审核门禁（本 workflow）：diff 仅限 plugins/、无 SKILL.md 被删、JSON 合法
# AI 审核：由 CodeRabbit GitHub App 独立评审（非阻塞，仅建议）
# 修 bug 只改这一个文件即可，不再维护 12 份副本
"on":
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      plugin:
        description: '只跑指定插件（留空跑全部）'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - anthropic
          - anydoc
          - baoyu
          - dbx
          - diagram
          - golang
          - grafana
          - illustration
          - lark
          - libtv
          - mattpocock
          - ppt
          - taste
          - wpsnote
          - writing

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          ALL='[
            {"plugin":"anthropic","add_path":"plugins/anthropic/","pr_hint":"plugins/anthropic/<skill>/"},
            {"plugin":"anydoc","add_path":"plugins/anydoc/","pr_hint":"plugins/anydoc/<skill>/"},
            {"plugin":"baoyu","add_path":"plugins/baoyu/","pr_hint":"plugins/baoyu/<skill>/"},
            {"plugin":"dbx","add_path":"plugins/dbx/","pr_hint":"plugins/dbx/<skill>/"},
            {"plugin":"diagram","add_path":"plugins/diagram/","pr_hint":"plugins/diagram/<skill>/"},
            {"plugin":"golang","add_path":"plugins/golang/","pr_hint":"plugins/golang/<skill>/"},
            {"plugin":"grafana","add_path":"plugins/grafana/","pr_hint":"plugins/grafana/<category>/<skill>/"},
            {"plugin":"illustration","add_path":"plugins/illustration/","pr_hint":"plugins/illustration/"},
            {"plugin":"khazix","add_path":"plugins/khazix/","pr_hint":"plugins/khazix/<skill>/"},
            {"plugin":"lark","add_path":"plugins/lark/","pr_hint":"plugins/lark/<skill>/"},
            {"plugin":"libtv","add_path":"plugins/libtv/","pr_hint":"plugins/libtv/<skill>/"},
            {"plugin":"mattpocock","add_path":"plugins/mattpocock/","pr_hint":"plugins/mattpocock/<bucket>/<skill>/"},
            {"plugin":"ppt","add_path":"plugins/ppt/","pr_hint":"plugins/ppt/guizang-ppt/"},
            {"plugin":"taste","add_path":"plugins/writing/taste/","pr_hint":"plugins/writing/taste/<skill>/"},
            {"plugin":"wpsnote","add_path":"plugins/writing/wpsnote/","pr_hint":"plugins/writing/wpsnote/<skill>/"},
            {"plugin":"writing","add_path":"plugins/writing/","pr_hint":"plugins/writing/<skill>/"}
          ]'
          SELECTED="${{ github.event.inputs.plugin }}"
          if [ -n "$SELECTED" ]; then
            MATRIX=$(echo "$ALL" | jq -c --arg p "$SELECTED" 'map(select(.plugin == $p))')
          else
            MATRIX=$(echo "$ALL" | jq -c '.')
          fi
          echo "matrix<<MATRIX_EOF" >> "$GITHUB_OUTPUT"
          echo "$MATRIX" >> "$GITHUB_OUTPUT"
          echo "MATRIX_EOF" >> "$GITHUB_OUTPUT"

  sync:
    needs: matrix-config
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJson(needs.matrix-config.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: sync-${{ matrix.plugin }}-skills
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run sync script
        id: sync
        env:
          CI_CHANGES_FILE: /tmp/updated-skills.txt
        run: |
          bash ./scripts/sync-${{ matrix.plugin }}-skills.sh
          if [ -f "$CI_CHANGES_FILE" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "updated<<EOF" >> "$GITHUB_OUTPUT"
            cat "$CI_CHANGES_FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            count=$(wc -l < "$CI_CHANGES_FILE" | tr -d ' ')
            echo "count=$count" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no changes
        if: steps.sync.outputs.has_changes != 'true'
        run: echo "✅ 所有 ${{ matrix.plugin }} skill 已是最新，无需 PR"

      - name: Create branch & commit
        id: commit
        if: steps.sync.outputs.has_changes == 'true'
        env:
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}
        run: |
          BRANCH="chore/sync-${{ matrix.plugin }}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -B "$BRANCH"
          git add ${{ matrix.add_path }}
          # 防御 sync 脚本误报：仅在确有可提交变化时才 commit/PR，避免空提交致 PR 失败
          if git diff --cached --quiet; then
            echo "pr_ready=false" >> "$GITHUB_OUTPUT"
            echo "[SKIP] ${{ matrix.plugin }}: 脚本报告有更新但 git 无实际差异，跳过 PR"
            exit 0
          fi
          git commit -m "$(cat <<COMMIT_EOF
          chore(${{ matrix.plugin }}): sync ${COUNT} upstream skill(s)

          Updated: $(echo "$UPDATED" | tr '\n' ' ')

          Run ./scripts/sync-${{ matrix.plugin }}-skills.sh --check locally to reproduce.
          COMMIT_EOF
          )"
          git push origin "$BRANCH" --force
          echo "pr_ready=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.commit.outputs.pr_ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}
          PR_HINT: ${{ matrix.pr_hint }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          PR_BODY=$(cat <<BODY
          ## 上游同步

          本次检测到 **${COUNT} 个** ${PLUGIN} skill 有上游更新，已自动 vendor 到 \`${{ matrix.add_path }}\`。

          ### 更新的 skill
          $(echo "$UPDATED" | sed 's/^/- /')

          ### 校验
          - ✅ 同步脚本执行完成
          - ✅ 自包含性自检通过

          ### 自动审核 & 合并
          - 门禁：diff 仅限 \`plugins/\`、无 \`SKILL.md\` 删除、JSON 合法
          - 通过即自动 squash 合并；不通过会评论原因并留人工
          - AI 评审（CodeRabbit）为非阻塞建议

          ---
          _此 PR 由 GitHub Action [\`sync-skills\`](../actions/workflows/sync-skills.yml) 自动生成。_
          BODY
          )

          # 幂等：每插件固定分支，已有 open PR 则仅 force-push 更新内容（PR 自动跟随），跳过重复创建
          EXISTING=$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            echo "已存在 open PR #${EXISTING}，已通过 force-push 更新内容，跳过重复创建"
            exit 0
          fi

          gh pr create \
            --title "chore(${PLUGIN}): sync ${COUNT} upstream skill(s) 🔄" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"

      - name: Auto-review & merge
        # 总是运行：既合并本次新建 PR，也清理本插件遗留 open sync PR（无 PR 则跳过）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          BRANCH="chore/sync-${PLUGIN}"
          # 定位本插件的 open PR（固定分支，新建/复用两种情形统一处理）
          PR=$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "${PR}" ]; then
            echo "未找到 ${BRANCH} 的 open PR，跳过自动合并"
            exit 0
          fi
          echo "🎯 自动审核 PR #${PR} (${PLUGIN})"

          # 拉取 main 做两点 diff（仅比树，浅克隆安全）
          git fetch origin main --depth=1
          CHANGED=$(git diff --name-only origin/main HEAD)
          echo "变更文件："; echo "${CHANGED}" | sed 's/^/  /'

          # 门禁 1：diff 仅允许落在 plugins/ 下，防止 sync 脚本误伤仓库基础设施
          OUT_OF_SCOPE=$(echo "${CHANGED}" | grep -v '^plugins/' || true)
          if [ -n "${OUT_OF_SCOPE}" ]; then
            MSG=$(printf '⛔ **自动审核未通过**：检测到 `plugins/` 之外的变更，已阻止自动合并，需人工介入：\n\n```\n%s\n```' "${OUT_OF_SCOPE}")
            gh pr comment "${PR}" --body "${MSG}"
            exit 1
          fi

          # 门禁 2：不允许删除 SKILL.md（上游删除需人工确认，防止 skill 静默丢失）
          DELETED_SKILL=$(git diff --name-only --diff-filter=D origin/main HEAD | grep 'SKILL.md$' || true)
          if [ -n "${DELETED_SKILL}" ]; then
            MSG=$(printf '⛔ **自动审核未通过**：检测到 SKILL.md 被删除，需人工确认：\n\n```\n%s\n```' "${DELETED_SKILL}")
            gh pr comment "${PR}" --body "${MSG}"
            exit 1
          fi

          # 门禁 3：受影响的 JSON 必须可解析（plugin.json / marketplace.json 等）
          JSON_FILES=$(echo "${CHANGED}" | grep -E '\.json$' || true)
          if [ -n "${JSON_FILES}" ]; then
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              if ! jq empty "$f" 2>/dev/null; then
                MSG=$(printf '⛔ **自动审核未通过**：JSON 文件 `%s` 解析失败。' "$f")
                gh pr comment "${PR}" --body "${MSG}"
                exit 1
              fi
            done <<< "${JSON_FILES}"
          fi

          echo "✅ 三道门禁通过，准备 squash 合并"
          if gh pr merge "${PR}" --squash --delete-branch; then
            echo "🎉 PR #${PR} 已自动合并到 main"
          else
            echo "⚠️ 直接合并失败，可能 main 启用了 required reviews 等分支保护"
            # 降级：尝试 GitHub 原生 auto-merge（需 repo settings 开启该功能）
            if gh pr merge "${PR}" --squash --auto --delete-branch 2>/dev/null; then
              gh pr comment "${PR}" --body "ℹ️ 自动合并被分支保护阻挡，已开启 auto-merge，待条件满足后自动合并。"
            else
              gh pr comment "${PR}" --body "⚠️ 自动合并失败。请检查 main 分支保护（是否要求 required reviews）或 CodeRabbit 等 required check 未通过。"
              exit 1
            fi
          fi
