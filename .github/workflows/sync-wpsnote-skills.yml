name: Sync wpsnote skills

# 定期同步 wpsnote/wpsnote-skills 的上游 skill（36 个扁平 skill 子目录）
# 机制：跑 scripts/sync-wpsnote-skills.sh → 若有更新则自动开 PR 等待人工 review
"on":
  schedule:
    # 每天 21:00 UTC（北京 05:00，与其他 sync 同时段）
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-wpsnote-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run sync script
        id: sync
        env:
          CI_CHANGES_FILE: /tmp/updated-skills.txt
        run: |
          bash ./scripts/sync-wpsnote-skills.sh
          if [ -f "$CI_CHANGES_FILE" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "updated<<EOF" >> "$GITHUB_OUTPUT"
            cat "$CI_CHANGES_FILE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            count=$(wc -l < "$CI_CHANGES_FILE" | tr -d ' ')
            echo "count=$count" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no changes
        if: steps.sync.outputs.has_changes != 'true'
        run: echo "✅ 所有 wpsnote skill 已是最新，无需 PR"

      - name: Create branch & commit
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          BRANCH="chore/sync-wpsnote-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add plugins/writing/wpsnote/
          git commit -m "$(cat <<COMMIT_EOF
          chore(wpsnote): sync ${COUNT} upstream skill(s)

          Updated: $(echo "$UPDATED" | tr '\n' ' ')

          Run ./scripts/sync-wpsnote-skills.sh --check locally to reproduce.
          COMMIT_EOF
          )"
          git push origin "$BRANCH"
        env:
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}

      - name: Create pull request
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.sync.outputs.count }}
          UPDATED: ${{ steps.sync.outputs.updated }}
        run: |
          PR_BODY=$(cat <<BODY
          ## 上游同步

          本次检测到 **${COUNT} 个** wpsnote skill 有上游更新，已自动 vendor 到 \`plugins/writing/wpsnote/\`。

          ### 更新的 skill
          $(echo "$UPDATED" | sed 's/^/- /')

          ### 校验
          - ✅ 同步脚本执行完成
          - ✅ 自包含性自检通过（依赖外部 wpsnote-cli；image_gen 已内联到 skill scripts/）

          ### 请人工 review
          - 查看 \`plugins/writing/wpsnote/<skill>/\` 的 diff
          - 确认 SKILL.md 行为变化可接受
          - 若上游新增了 skill 目录，脚本会提示——需手动把新 skill 加入 \`marketplace.json\` 中 wpsnote-skills 的 skills 数组
          - 合并即可，合入后 marketplace 用户 \`/plugin update\` 自动跟进

          ---
          _此 PR 由 GitHub Action [\`sync-wpsnote-skills\`](../actions/workflows/sync-wpsnote-skills.yml) 自动生成。_
          BODY
          )

          gh pr create \
            --title "chore(wpsnote): sync ${COUNT} upstream skill(s) 🔄" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"
